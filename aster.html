<!DOCTYPE html>
<html>
<head>
  <title>ASTER</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
   body { background: linear-gradient(135deg,#FFE9F3,#301934,#CBC3E3,#301934) fixed; min-height:100vh; margin:0; padding:20px; font-family:'Poppins',sans-serif;
    .logo { display:block; width:220px; margin:0 auto 25px; }

    .products { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; }
    .card { border:2px solid #E6E6FA; border-radius:12px; padding:10px; width:220px; text-align:center; overflow:hidden; }
    .card img { width:100%; display:block; border-radius:8px; transition:transform .3s; cursor:pointer; }
    .card img:hover { transform:scale(1.15); }
    .name { color:#FDF6E2; margin:12px 0 2px; font-weight:600; font-size:14px; cursor:pointer; }
    .price { color:#EDE3F7; margin:2px 0 10px; font-size:13px; font-weight:600; }
    button { font-family:inherit; cursor:pointer; }
    .cart-btn, .buy-btn { background:#734F96; color:#fff; border:none; font-weight:600; }
    .cart-btn { border-radius:20px; padding:8px 18px; font-size:12px; }
    .buy-btn { width:100%; margin-top:18px; border-radius:24px; padding:12px; font-size:14px; }
    .cart-btn:hover, .buy-btn:hover { background:#5d3f7a; }

    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); justify-content:center; align-items:center; padding:20px; box-sizing:border-box; }
    .overlay.active { display:flex; }
    .box { background:linear-gradient(135deg,#F5EEE2,#EDE3F7); border-radius:16px; max-width:480px; width:100%; max-height:85vh; overflow-y:auto; padding:28px; box-sizing:border-box; position:relative; color:#4A3B57; font-size:13px; line-height:1.6; }
    .close { position:absolute; top:14px; right:18px; font-size:22px; color:#734F96; background:none; border:none; }
    h2 { color:#734F96; font-size:20px; margin:0 0 10px; }
    h4 { color:#734F96; font-size:14px; margin:16px 0 6px; }
    ul, ol { margin:4px 0 0; padding-left:18px; }

    .field { width:100%; margin-top:10px; padding:10px; border:1px solid #734F96; border-radius:8px; font-family:inherit; font-size:13px; box-sizing:border-box; }
    .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed #734F96; }
    .qty button { width:26px; height:26px; border-radius:50%; border:1px solid #734F96; background:none; color:#734F96; font-weight:700; }
    .total { font-weight:700; font-size:16px; color:#734F96; }
  </style>
</head>
<body>

  <img class="logo" src="LOGONOBG.PNG" alt="ASTER">

  <div class="products">
    <div class="card">
      <img src="aster package.jpg" onclick="openInfo('glowset')">
      <div class="name" onclick="openInfo('glowset')">Glow Set</div>
      <p class="price">₱2,499.00</p>
      <button class="cart-btn" onclick="addToCart('glowset')">ADD TO CART</button>
    </div>
    <div class="card">
      <img src="8697fca0-0a86-4503-b3a6-ebba24df29a9.jpg" onclick="openInfo('cleanser')">
      <div class="name" onclick="openInfo('cleanser')">Foaming Cleanser</div>
      <p class="price">₱380.00</p>
      <button class="cart-btn" onclick="addToCart('cleanser')">ADD TO CART</button>
    </div>
    <div class="card">
      <img src="2b148b50-b975-449b-b593-34c4dbb7c256.jpg" onclick="openInfo('serum')">
      <div class="name" onclick="openInfo('serum')">Serum</div>
      <p class="price">₱450.00</p>
      <button class="cart-btn" onclick="addToCart('serum')">ADD TO CART</button>
    </div>
    <div class="card">
      <img src="91df123f-ad20-4b17-a6c9-d94497577a13.jpg" onclick="openInfo('moisturizer')">
      <div class="name" onclick="openInfo('moisturizer')">Gel Moisturizer</div>
      <p class="price">₱420.00</p>
      <button class="cart-btn" onclick="addToCart('moisturizer')">ADD TO CART</button>
    </div>
  </div>

  <div class="overlay" id="popup" onclick="if(event.target===this)closePopup()">
    <div class="box">
      <button class="close" onclick="closePopup()">&times;</button>
      <div id="popupContent"></div>
    </div>
  </div>

  <script>
    const products = {
      glowset: {
        title: "Aster Complete Glow Set", price: 2499,
        description: "The full Aster ritual: a clean, luxury skincare collection for your whole routine, in lavender-and-cream packaging with a satin ribbon. Perfect for gifting or treating yourself.",
        included: ["Foaming Cleanser", "Serum (pump bottle)", "Serum (tube)", "Serum (dropper)", "Gel Moisturizer (two sizes)", "Eye Cream", "Lip Treatment", "Gua Sha Tool", "Cleansing Sponge"],
        bestTime: "Morning and night.",
        steps: ["Cleanse with the Foaming Cleanser.", "Apply Serum.", "Follow with Eye Cream.", "Seal in with Gel Moisturizer.", "Finish with Lip Treatment.", "Use the Gua Sha a few times a week."]
      },
      cleanser: {
        title: "Aster Foaming Cleanser", price: 380,
        description: "A gentle cleanser that turns into a soft, airy foam to lift away dirt and oil without stripping the skin.",
        bestTime: "Morning and night.",
        steps: ["Wet face with lukewarm water.", "Pump a small amount onto palms.", "Massage in circles to foam.", "Rinse and pat dry."]
      },
      serum: {
        title: "Aster Serum", price: 450,
        description: "A lightweight, fast-absorbing treatment that hydrates, brightens, and strengthens the skin barrier.",
        bestTime: "Morning and night.",
        steps: ["Cleanse first.", "Take 2–3 drops.", "Pat gently into face and neck.", "Follow with moisturizer."]
      },
      moisturizer: {
        title: "Aster Gel Moisturizer", price: 420,
        description: "An ultra-lightweight water-gel moisturizer for lasting hydration without the greasy feel.",
        bestTime: "Morning and night, as the last step.",
        steps: ["Apply on clean skin after serum.", "Smooth a dime-sized amount over face and neck.", "Massage upward until absorbed."]
      }
    };

    const peso = n => "₱" + n.toLocaleString("en-PH", { minimumFractionDigits: 2 });
    const $ = id => document.getElementById(id);
    let current, qty;

    function show(html) {
      $("popupContent").innerHTML = html;
      $("popup").classList.add("active");
    }
    function closePopup() { $("popup").classList.remove("active"); }

    function openInfo(id) {
      const p = products[id];
      show(`
        <h2>${p.title}</h2>
        <p><b>${peso(p.price)}</b></p>
        <p>${p.description}</p>
        ${p.included ? `<h4>What's included</h4><ul>${p.included.map(i => `<li>${i}</li>`).join("")}</ul>` : ""}
        <h4>Best time to use</h4><p>${p.bestTime}</p>
        <h4>How to use</h4><ol>${p.steps.map(s => `<li>${s}</li>`).join("")}</ol>
        <button class="buy-btn" onclick="addToCart('${id}')">ADD TO CART</button>`);
    }

    function addToCart(id) {
      current = id; qty = 1;
      const p = products[id];
      show(`
        <h2>Order Slip</h2>
        <input class="field" id="custName" placeholder="Full name">
        <textarea class="field" id="custAddress" rows="2" placeholder="Complete address"></textarea>
        <div class="row" style="margin-top:14px"><span>${p.title}</span><span>${peso(p.price)}</span></div>
        <div class="row"><span>Quantity</span>
          <span class="qty"><button onclick="changeQty(-1)">−</button> <span id="qtyNum">1</span> <button onclick="changeQty(1)">+</button></span>
        </div>
        <div class="row total"><span>Total</span><span id="slipTotal">${peso(p.price)}</span></div>
        <button class="buy-btn" onclick="buyNow()">BUY</button>`);
    }

    function changeQty(n) {
      qty = Math.max(1, qty + n);
      $("qtyNum").textContent = qty;
      $("slipTotal").textContent = peso(products[current].price * qty);
    }

    function buyNow() {
      const name = $("custName").value.trim();
      const address = $("custAddress").value.trim();
      if (!name || !address) return alert("Please enter your name and address.");
      const p = products[current];
      show(`
        <h2>Thank you!</h2>
        <p><b>Name:</b> <span id="outName"></span></p>
        <p><b>Address:</b> <span id="outAddress"></span></p>
        <p>${qty} × ${p.title} — <b>${peso(p.price * qty)}</b></p>
        <p>Glow. Nurture. Bloom.</p>`);
      $("outName").textContent = name;
      $("outAddress").textContent = address;
    }
  </script>
</body>
</html>
