  <style>
       img.zoom-img {
      transition: transform 0.3s ease; 
      cursor: pointer;
    }
    
      img.zoom-img:hover {
      transform: scale(1.15); 
    }

    .product-label {
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
      display: inline-block;
    }

    .product-label:hover {
      color: #E6E6FA;
      transform: scale(1.06);
    }

    /* Modal styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: linear-gradient(135deg,#F5EEE2,#EDE3F7);
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px;
      box-sizing: border-box;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 22px;
      font-weight: 700;
      color: #734F96;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
    }

    .modal-title {
      color: #734F96;
      font-weight: 700;
      font-size: 20px;
      margin: 0 0 12px 0;
    }

    .modal-section-title {
      color: #734F96;
      font-weight: 600;
      font-size: 14px;
      margin: 16px 0 6px 0;
    }

    .modal-text {
      color: #4A3B57;
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
    }

    .modal-list {
      color: #4A3B57;
      font-size: 13px;
      line-height: 1.7;
      margin: 4px 0 0 0;
      padding-left: 18px;
    }
  </style>
